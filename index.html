<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e6">
<meta name="description" content="2026 校园读书月 · 读一本书，遇见一个世界。全校共读计划、读书感受墙、投稿通道。">
<meta name="format-detection" content="telephone=no">
<title>2026 校园读书月 · 阅见世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23a63a2b'/%3E%3Ctext x='50' y='72' font-size='56' text-anchor='middle' fill='%23f6ecd8' font-family='serif'%3E书%3C/text%3E%3C/svg%3E">
</head>
<body class="page-home">

<!-- 顶部滚动进度条：一道朱砂墨线 -->
<div class="progress" id="progress" aria-hidden="true"></div>

<!-- 飞书装饰：仅较大屏幕显示 -->
<div class="page-flock" aria-hidden="true">
  <svg class="flock" viewBox="0 0 400 160">
    <path d="M10 40 q14 -10 28 0 q14 -10 28 0" />
    <path d="M150 100 q12 -9 24 0 q12 -9 24 0" />
    <path d="M300 30 q11 -8 22 0 q11 -8 22 0" />
    <path d="M60 120 q10 -7 20 0 q10 -7 20 0" />
    <path d="M230 130 q13 -9 26 0 q13 -9 26 0" />
  </svg>
</div>

<!-- ========== 吸顶导航 ========== -->
<header class="topbar" id="topbar">
  <a class="topbar__brand" href="#intro">
    <span class="topbar__seal" aria-hidden="true">书</span>
    <span class="topbar__name">读书月</span>
  </a>
  <nav class="topbar__nav" aria-label="页面导航">
    <a href="#feed" class="topbar__link">感受墙</a>
    <a href="#intro" class="topbar__link">活动介绍</a>
  </nav>
</header>

<!-- ========== 一、读书月介绍页 ========== -->
<section class="hero" id="intro">
  <div class="hero__bg" aria-hidden="true">
    <svg class="hero__book" viewBox="0 0 300 190" fill="none">
      <path class="book-page book-page--l" d="M150 26 C118 12 76 12 44 24 L44 156 C76 144 118 144 150 158 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <path class="book-page book-page--r" d="M150 26 C182 12 224 12 256 24 L256 156 C224 144 182 144 150 158 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <path d="M150 26 L150 158" stroke="currentColor" stroke-width="3"/>
      <path class="book-line" d="M66 58 C92 50 118 50 136 56" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="book-line" d="M66 84 C92 76 118 76 136 82" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="book-line" d="M164 56 C182 50 208 50 234 58" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="book-line" d="M164 82 C182 76 208 76 234 84" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="book-bird" d="M100 8 q7 -5 14 0 q7 -5 14 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path class="book-bird" d="M180 16 q6 -4 12 0 q6 -4 12 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>

    <span class="hero__sun"></span>
    <span class="hero__hill hero__hill--f"></span>
    <span class="hero__hill hero__hill--b"></span>

    <!-- 飘浮墨点 / 纸屑 -->
    <canvas class="hero__canvas" id="inkCanvas"></canvas>

    <span class="hero__papergrain"></span>
  </div>

  <div class="hero__inner">
    <p class="hero__badge reveal" style="--d:.05s">
      <span class="seal-seal" aria-hidden="true">读书月</span>
      <span class="badge-text">2026 校园读书月 · 第 12 届</span>
    </p>

    <h1 class="hero__title reveal" style="--d:.15s">
      <span class="line">读一本书</span>
      <span class="line">遇见<span class="brush">一个世界</span></span>
      <svg class="title-brush" viewBox="0 0 220 16" aria-hidden="true" preserveAspectRatio="none">
        <path d="M4 10 C60 4 160 4 216 8" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/>
      </svg>
    </h1>

    <p class="hero__sub reveal" style="--d:.25s">
      4 月 23 日 — 5 月 23 日 · 全校共读计划<br>
      <em>你读过的每一页，都有人正在读。</em>
    </p>

    <p class="countdown__label reveal" style="--d:.3s" id="cdLabel">距本届读书月结束</p>

    <div class="countdown reveal" style="--d:.35s" id="countdown" aria-label="活动倒计时">
      <div class="countdown__item"><b id="cdDay">--</b><i>天</i></div>
      <div class="countdown__item"><b id="cdHour">--</b><i>时</i></div>
      <div class="countdown__item"><b id="cdMin">--</b><i>分</i></div>
      <div class="countdown__item"><b id="cdSec">--</b><i>秒</i></div>
    </div>

    <ul class="stats reveal" style="--d:.45s">
      <li class="stat-note"><b data-count="128">0</b><i>场活动</i><span class="fold"></span></li>
      <li class="stat-note stat-note--r"><b data-count="12480">0</b><i>同学参与</i><span class="fold"></span></li>
      <li class="stat-note"><b data-count="96">0</b><i>篇读书感受</i><span class="fold"></span></li>
    </ul>

    <div class="hero__actions reveal" style="--d:.55s">
      <a class="btn btn--primary" href="#feed" id="ctaStart">
        <span class="btn__seal" aria-hidden="true">阅</span>
        进入感受墙
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </a>
      <a class="btn btn--ghost" href="#intro" id="ctaRule">活动规则</a>
    </div>
  </div>

  <button class="scroll-hint" id="scrollHint" type="button" aria-label="下滑进入主界面">
    <span>把这一页轻轻翻开</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6"/></svg>
  </button>
</section>

<!-- ========== 二、主界面：读书感受墙 ========== -->
<main class="feed" id="feed">
  <div class="shell">

    <div class="page-divider" aria-hidden="true">
      <span class="page-divider__rule"></span>
      <svg class="page-divider__mark" viewBox="0 0 44 26" fill="none">
        <path d="M22 6c-5-3-11-3-16-1v14c5-2 11-2 16 1M22 6c5-3 11-3 16-1v14c-5-2-11-2-16 1M22 6v14" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="page-divider__rule"></span>
    </div>

    <header class="feed__head js-reveal">
      <p class="feed__eyebrow">
        <svg class="eyebrow-rule" viewBox="0 0 48 2" aria-hidden="true"><path d="M0 1h48" stroke="currentColor" stroke-width="2"/></svg>
        读书感受墙 · 共读笔记
        <svg class="eyebrow-rule eyebrow-rule--r" viewBox="0 0 48 2" aria-hidden="true"><path d="M0 1h48" stroke="currentColor" stroke-width="2"/></svg>
      </p>
      <h2 class="feed__title">读书感受墙</h2>
      <p class="feed__desc">来自全校同学的阅读笔记 · 内容由外部内容 API 提供</p>

      <!-- 搜索 -->
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <svg class="search__ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
        </svg>
        <input class="search__input" id="searchInput" type="search" placeholder="搜一搜书名、标题、感受或作者…"
               enterkeyhint="search" aria-label="搜索读书感受">
        <button class="search__clear" id="searchClear" type="button" aria-label="清空搜索" hidden>×</button>
        <button class="search__btn" type="submit">搜索</button>
      </form>

      <!-- 排序 -->
      <div class="sorts" id="sorts" role="tablist" aria-label="排序方式">
        <button class="chip is-on" data-sort="new" role="tab" aria-selected="true" type="button">刚出炉</button>
        <button class="chip" data-sort="hot" role="tab" aria-selected="false" type="button">最多共鸣</button>
        <button class="chip" data-sort="comments" role="tab" aria-selected="false" type="button">聊得热闹</button>
      </div>

      <!-- 分类 -->
      <div class="chips" id="chips" role="tablist" aria-label="按分类筛选">
        <!-- 由 JS 渲染 -->
      </div>

      <!-- 标签 -->
      <div class="chips chips--tag" id="tags" role="tablist" aria-label="按标签筛选">
        <!-- 由 JS 渲染 -->
      </div>

      <!-- 筛选摘要 -->
      <p class="filter-summary" id="filterSummary" hidden></p>
    </header>

    <div class="feed__list" id="feedList" aria-live="polite" aria-busy="true"></div>

    <!-- 无限滚动哨兵：接近底部自动加载下一页 -->
    <div id="feedSentinel" style="height:1px" aria-hidden="true"></div>

    <div class="feed__status" id="feedStatus">
      <span class="spinner" aria-hidden="true"></span>
      <span>正在翻下一页…</span>
    </div>

    <p class="feed__api" id="apiHint"></p>
  </div>

  <button class="back-top" id="backTop" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
  </button>
</main>

<!-- ========== 右下角：朱红书签丝带 ========== -->
<a class="fab" id="fabSubmit" href="https://www.baidu.com" rel="noopener">
  <svg class="fab__ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6 3.5h12v17.5l-6-4.5-6 4.5z"/>
  </svg>
  <span class="fab__txt">提交投稿</span>
</a>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/effects.js"></script>
<script src="js/app.js"></script>
</body>
</html>
